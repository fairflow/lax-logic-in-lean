<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="600" fill="#222">3. Orbits: the "same" element at every level, σᵏ(a) for a in the outer shell L₀</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b22"/>
    </marker>
  </defs>

  <!-- column headers -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <text x="110" y="70" fill="#1f4f9e">L₀ = F0 ∖ σ(F0)</text>
    <text x="270" y="70" fill="#226b3a">L₁</text>
    <text x="420" y="70" fill="#9a620b">L₂</text>
    <text x="560" y="70" fill="#7a2c7a">L₃</text>
    <text x="650" y="70" fill="#666">⋯</text>
    <text x="745" y="62" fill="#444">order limit</text>
    <text x="745" y="78" fill="#444" font-weight="400" font-size="12">(in F0)</text>
    <text x="875" y="62" fill="#444">inside-out limit</text>
    <text x="875" y="78" fill="#444" font-weight="400" font-size="12">(a set)</text>
  </g>
  <!-- column bands -->
  <rect x="30" y="90" width="160" height="330" fill="#e6eefb"/>
  <rect x="200" y="90" width="140" height="330" fill="#e5f4e9"/>
  <rect x="350" y="90" width="140" height="330" fill="#fcf1dc"/>
  <rect x="500" y="90" width="120" height="330" fill="#f4e6f4"/>
  <rect x="690" y="90" width="110" height="330" fill="#f2f2f2"/>
  <rect x="815" y="90" width="125" height="330" fill="#fff6f6" stroke="#b22" stroke-width="1"/>

  <!-- rows: orbit of a = ⊥, ◯⊥, ¬◯⊥, t5 -->
  <g font-size="14" text-anchor="middle" fill="#222">
    <!-- row 1 -->
    <text x="110" y="130">⊥</text>
    <text x="270" y="130">t3 = σ⊥</text>
    <text x="420" y="130">σ²⊥</text>
    <text x="560" y="130">σ³⊥</text>
    <text x="650" y="130" fill="#666">⋯</text>
    <text x="745" y="130">⊤</text>
    <text x="877" y="130" fill="#8a1a1a">T_⊥(ω)</text>
    <!-- row 2 -->
    <text x="110" y="200">◯⊥</text>
    <text x="270" y="200">◯t3</text>
    <text x="420" y="200">◯σ²⊥</text>
    <text x="560" y="200">◯σ³⊥</text>
    <text x="650" y="200" fill="#666">⋯</text>
    <text x="745" y="200">⊤</text>
    <text x="877" y="200" fill="#8a1a1a">T_◯⊥(ω)</text>
    <!-- row 3 -->
    <text x="110" y="270">¬◯⊥</text>
    <text x="270" y="270">◯t3 ↠ t3</text>
    <text x="420" y="270">σ²(¬◯⊥)</text>
    <text x="560" y="270">σ³(¬◯⊥)</text>
    <text x="650" y="270" fill="#666">⋯</text>
    <text x="745" y="270">⊤</text>
    <text x="877" y="270" fill="#8a1a1a">T_¬◯⊥(ω)</text>
    <!-- row 4 -->
    <text x="110" y="340">t5</text>
    <text x="270" y="340">σ(t5)</text>
    <text x="420" y="340">σ²(t5)</text>
    <text x="560" y="340">σ³(t5)</text>
    <text x="650" y="340" fill="#666">⋯</text>
    <text x="745" y="340">⊤</text>
    <text x="877" y="340" fill="#8a1a1a">T_t5(ω)</text>
    <!-- row 5 -->
    <text x="110" y="400" fill="#666">⋮  (every a ∈ L₀)</text>
    <text x="270" y="400" fill="#666">⋮</text>
    <text x="420" y="400" fill="#666">⋮</text>
    <text x="560" y="400" fill="#666">⋮</text>
    <text x="745" y="400" fill="#666">⋮</text>
    <text x="877" y="400" fill="#666">⋮</text>
  </g>

  <!-- sigma arrows along each row -->
  <g stroke="#b22" stroke-width="1.4" fill="none" marker-end="url(#ar)">
    <line x1="150" y1="145" x2="225" y2="145"/>
    <line x1="315" y1="145" x2="385" y2="145"/>
    <line x1="455" y1="145" x2="530" y2="145"/>
    <line x1="150" y1="215" x2="225" y2="215"/>
    <line x1="315" y1="215" x2="385" y2="215"/>
    <line x1="455" y1="215" x2="530" y2="215"/>
    <line x1="150" y1="285" x2="225" y2="285"/>
    <line x1="315" y1="285" x2="385" y2="285"/>
    <line x1="455" y1="285" x2="530" y2="285"/>
    <line x1="150" y1="355" x2="225" y2="355"/>
    <line x1="315" y1="355" x2="385" y2="355"/>
    <line x1="455" y1="355" x2="530" y2="355"/>
  </g>
  <text x="188" y="160" font-size="12" fill="#b22" font-style="italic" text-anchor="middle">σ</text>
  <text x="350" y="160" font-size="12" fill="#b22" font-style="italic" text-anchor="middle">σ</text>
  <text x="492" y="160" font-size="12" fill="#b22" font-style="italic" text-anchor="middle">σ</text>

  <!-- notes -->
  <g font-size="13.5" fill="#222">
    <text x="30" y="450">Each ROW is one orbit; each COLUMN is one shell. σ maps each shell one-to-one onto the next (pen), so the rows fill</text>
    <text x="30" y="470">every shell exactly once: the orbits correspond to the elements of L₀, and every x ≠ ⊤ sits in exactly one row and column.</text>
    <text x="30" y="494">Order limit: for every x ≠ ⊤, σⁿ(a) ⊢ x fails from some n on (pen), so the only candidate is ⊤, the same for every row: the order</text>
    <text x="30" y="514">forgets which element you followed. The inside-out limit T_a(ω) (figure 4) keeps it: T_a(ω) = T_b(ω) only when a ⊣⊢ b.</text>
  </g>
</svg>
