<text x="310" y="300" font-size="12" fill="#8a93a6" text-anchor="middle">infinite — every rung a distinct class of RN(◯,∅)</text>
<text x="20" y="905" font-size="11.5" fill="#8a93a6">Zigzag: odd rungs have two upper covers, even rungs one.  Rungs rn₀…rn₈ land on catalogue classes (labels);</text>
<text x="20" y="920" font-size="11.5" fill="#8a93a6">rn₈ ≡ ρ13was a sweep DISCOVERY the ladder predicts.  From rn₉ up the rungs leave the current 22-class catalogue R.</text>
