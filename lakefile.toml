name = "lax-logic"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Core"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

# ---------------------------------------------------------------------------
# `Core` — THE PUBLISHABLE CORE.  The default target.
#
# Every module reachable from `Core.lean` belongs to a campaign whose
# terminal result is PROVED (or is a completed refutation), is sorry-free,
# and reaches no `wip/` module.  `Core/Audit.lean` pins the axioms of each
# campaign's terminal theorem, so `lake build` failing IS the claim failing.
#
# Campaigns that never reached their terminal result are excluded whole,
# including their sorry-free parts: the semantic UI route, the G4c UI
# tower, the polarised/focusing programme and the LJF-circle minimality
# tail.  Their files are still here and still build (`lake build
# LaxLogic`); NOTES-FOR-DEVELOPERS.md says where each one stands.  The
# working record itself -- wip/, and the ~95 probe executables rooted in
# it -- is NOT on this branch, and neither are the two libraries that
# imported it (Rewrite/, FRJO/).  All of it remains on the development
# branches and in history.
[[lean_lib]]
name = "Core"
globs = ["Core", "Core.Audit"]

# The full working library, including the parked campaigns.  Not the
# default target; build it by name.
[[lean_lib]]
name = "LaxLogic"

# BiLax: the bi-lax extension of PLL (docs/bilax-plan.md), kept out of
# the cluttered main directory.  Root module imports the round files.
[[lean_lib]]
name = "BiLax"

# Reject: the forward model-generating refutation calculus for PLL
# (docs/frj-lifting.md), after Fiorentini-Ferrari FRJ(G) and their
# JLC 2021 S4 model-generation calculus.
[[lean_lib]]
name = "Reject"

# Meta: the axiom-audit tooling (`#axiom_pin`, `#choice_path`).
[[lean_lib]]
name = "Meta"

# FRJ: a faithful formalisation of Fiorentini-Ferrari's forward refutation
# calculus FRJ(G) for IPC (TOCL 21(3), 2020; arXiv:1804.06689).  Base case
# only: no modality.  Independent of LaxLogic/.
[[lean_lib]]
name = "FRJ"

[[lean_exe]]
name = "bilaxscreen"
root = "BiLax.Screens"

# Historical note: on v4.22.0-rc3 the `laxrun` binary segfaulted at startup
# (cache-shipped C IR miscompile in Mathlib.Data.Set.Basic; full analysis in
# Main.lean's history).  FIXED by the v4.31.0 toolchain bump (adopted here,
# 2026-07-19): native executables build and run; `scripts/laxrun.sh` remains
# as an interpreter fallback.
[[lean_exe]]
name = "laxrun"
root = "Main"

# ---------------------------------------------------------------------------
# `pstates` — the proof-state recorder and replay viewer (tools/proofstates/).
# Elaborates a .lean file, walks Lean's own info trees, and writes a
# self-contained HTML page that replays every tactic step with its goals
# before and after.  `supportInterpreter` is required because the tool runs
# the Lean frontend, which uses the interpreter for elaborators.
[[lean_lib]]
name = "proofstates"
globs = ["tools.proofstates.Recorder", "tools.proofstates.Html"]

[[lean_exe]]
name = "pstates"
root = "tools.proofstates.Main"
supportInterpreter = true
