name = "lax-logic"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LaxLogic", "FRJGbu"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "LaxLogic"

# BiLax: the bi-lax extension of PLL (docs/bilax-plan.md), kept out of
# the cluttered main directory.  Root module imports the round files.
[[lean_lib]]
name = "BiLax"

# Reject: the forward model-generating refutation calculus for PLL
# (docs/frj-lifting.md), after Fiorentini-Ferrari FRJ(G) and their
# JLC 2021 S4 model-generation calculus.
[[lean_lib]]
name = "Reject"

# Rewrite: certified interderivabilities used as a simplifier.
# Certified: LAYER 1 of the RN(◯,{}) mapping — the register of every
# theorem the dictionary is allowed to cite, each re-pinned here with a
# #guard_msgs-checked #print axioms.  Imports upward only: it may cite
# LaxLogic/, FRJ/, Reject/ and wip/, and nothing may cite it except the
# tools and the database.
# LJF: LJF and LJF◯, the focused sequent calculi, split out of LaxLogic/
# on 2026-08-22 to modularise.  Dependency runs LJF -> LaxLogic only.
[[lean_lib]]
name = "LJF"
globs = ["LJF.Base", "LJF.Complete", "LJF.OCore", "LJF.OUniverse", "LJF.ORows",
         "LJF.OHeight", "LJF.OFuel", "LJF.O", "LJF.OSearch", "LJF.OBridge",
         "LJF.OAudit"]

# RNDB: LAYER 3 — the dictionary database types (Claim/Evidence/Entry/
# Frontier, the un-sorriable `ok` field).  Built by a delegated agent
# 2026-08-21 in worktree agent-aea09736d84d32c6f; pulled in 2026-08-24.
[[lean_lib]]
name = "RNDB"
globs = ["RNDB.Types", "RNDB.RhoEntries", "RNDB.DictEntries", "RNDB.Dict2Entries", "RNDB.FRJCertEntries", "RNDB.DerivedEntries", "RNDB.EscEntries", "RNDB.DB", "RNDB.Examples", "RNDB.Frontier79", "RNDB.Order", "RNDB.SepEntries", "RNDB.Diamond"]

[[lean_lib]]
name = "Certified"
globs = ["Certified.Register", "Certified.RhoRefutations", "Certified.RhoSeparations", "Certified.RhoFRJV"]

[[lean_lib]]
name = "Rewrite"

# FRJO: the refutation calculus dual to LJF◯ search (FRJ extended to ◯);
# derivations are finite checkable trees, extraction via the unraveller's
# assembly, soundness per instance through FinCM.checkB.
[[lean_lib]]
name = "FRJO"

# FRJ: a faithful formalisation of Fiorentini-Ferrari's forward refutation
# calculus FRJ(G) for IPC (TOCL 21(3), 2020; arXiv:1804.06689).  Base case
# only: no modality.  Independent of FRJO/ and of LaxLogic/.
[[lean_lib]]
name = "Meta"

[[lean_lib]]
name = "FRJ"

# FRJGbu: the Gbu◯/FRJW decision chain, promoted out of wip/ on
# 2026-09-02 (core admission: the closure of the crown
# `FRJ.Gbu.W.Saturate` — `decideGbuW`, the completeness pair,
# `decidePLL`).  The LJF◯ route to Gbu◯ completeness is NOT core and
# stays in wip/ (`wip.gbu_ljfo_support`, `wip.gbu_ljfo_transport`,
# `wip.gbu_ljfo`).
#
# The globs are an explicit `one` list, as everywhere else in this file:
# a `submodules` glob (`FRJ.Gbu.*`, and equally `FRJ.Gbu.W.*`) makes
# `lake build FRJGbu` fail with "FRJGbu: some modules have bad imports"
# on this toolchain, while the identical explicit list is green.
[[lean_lib]]
name = "FRJGbu"
globs = ["FRJ.Gbu.Base", "FRJ.Gbu.DB", "FRJ.Gbu.Search", "FRJ.Gbu.Measure", "FRJ.Gbu.Circ", "FRJ.Gbu.Transport", "FRJ.Gbu.W.Dichotomy", "FRJ.Gbu.W.DB", "FRJ.Gbu.W.CircDB", "FRJ.Gbu.W.Corner", "FRJ.Gbu.W.Search", "FRJ.Gbu.W.Closure", "FRJ.Gbu.W.Exclusion", "FRJ.Gbu.W.Saturate", "FRJ.Gbu.LaxND", "FRJ.Gbu.W.LaxND"]

[[lean_exe]]
name = "bilaxscreen"
root = "BiLax.Screens"

[[lean_exe]]
name = "wscreen"
root = "tools.WScreen"

# a2probe: the arity question of the practical decision-procedure
# campaign — is the k-bounded join saturation closed under all arities?
# One cell per invocation.  (2026-09-02)
[[lean_exe]]
name = "a2probe"
root = "tools.A2Probe"


# Historical note: on v4.22.0-rc3 the `laxrun` binary segfaulted at startup
# (cache-shipped C IR miscompile in Mathlib.Data.Set.Basic; full analysis in
# Main.lean's history).  FIXED by the v4.31.0 toolchain bump (adopted here,
# 2026-07-19): native executables build and run; `scripts/laxrun.sh` remains
# as an interpreter fallback.
[[lean_exe]]
name = "laxrun"
root = "Main"

