name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Publishable core
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # `Core` is the default target, so this builds Core.lean and
      # Core/Audit.lean.  It fails if any module fails to elaborate, if any
      # `#guard_msgs` axiom pin stops matching, or if a `sorry` is
      # reintroduced (see the guard step below).
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"

      # Lean warns rather than errors on `sorry`, so the build alone would
      # not catch a reintroduced one.  Rebuild with the log captured and
      # fail on the warning.
      - name: No `sorry` in the core
        run: |
          set -o pipefail
          lake build 2>&1 | tee /tmp/core.log
          # -a: treat the log as text.  A NUL anywhere in it (Lean can echo
          # source into a warning, and source may legitimately contain one)
          # makes some grep variants classify the whole file as binary and
          # report nothing -- the gate would then pass by being blind.
          if grep -a -q "declaration uses \`sorry\`" /tmp/core.log; then
            echo "::error::a declaration in the core uses 'sorry'"
            grep -a "declaration uses \`sorry\`" /tmp/core.log
            exit 1
          fi

      # `lake build` builds only `defaultTargets` (= Core), so every other
      # declared library and executable would go unbuilt and a break in one
      # would pass unnoticed.  Enumerate the targets out of lakefile.toml and
      # build each by name.
      - name: Every declared target builds
        run: |
          set -o pipefail
          FAIL=0
          for t in $(python3 scripts/all-targets.py); do
            echo "::group::lake build $t"
            if lake build "$t" 2>&1 | tail -40; then echo "ok $t"; else
              echo "::error::target $t failed to build"; FAIL=1; fi
            echo "::endgroup::"
          done
          exit $FAIL

      # What Lean cannot see: that the core's import closure stays inside
      # the core (no wip/, no trimmed campaign) and that every module is
      # documented.
      - name: Structural audit
        run: python3 scripts/core-audit.py --check
