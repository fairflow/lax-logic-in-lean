name: Lean Action CI

on:
  # Branch-filtered on Matthew's instruction, 2026-09-06.  An unfiltered `push:`
  # fired on every push to every branch — 39 runs in one day across three
  # branches — and `leanprover/lean-action@v1` mints a ~2.6 GB cache per branch.
  # GitHub scopes caches by branch, so sibling branches cannot share one; the
  # repo sat at 13.1 GB against a 10 GB quota with eviction running constantly.
  #
  # Narrowed to `main` on Matthew's instruction, 2026-09-16, once the four
  # lines were merged: `main` is now the consolidated line, and one branch
  # means one ~2.6 GB cache instead of a per-branch cache under a 10 GB quota.
  # The existing caches were deleted at the same time.
  #
  # `pull_request` is filtered to PRs *targeting* `main` — the check still runs
  # where it matters, and a PR between side branches no longer mints a cache.
  # Any branch can be built on demand via workflow_dispatch.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1

      # The proof-status gate (`docs/ledger-campaign-2026-09-16.md`).  It reads
      # the `.olean`s the step above produced, so `--built-only`: CI builds the
      # default targets, not the papers or `wip/`, and the gate compares within
      # that scope instead of reporting the rest as vanished.
      #
      # A REGRESSION (exit 1) fails the run: a declaration gained `sorryAx`, an
      # axiom, or a `native_decide` taint, or vanished.  A STALE record (exit 2)
      # is only an annotation — adding a theorem is not a fault, it means
      # `scripts/check-ledger.sh --update` is owed.
      - name: Proof-status ledger
        run: |
          set +e
          scripts/check-ledger.sh --built-only
          rc=$?
          set -e
          case $rc in
            0) echo "ledger: clean" ;;
            2) echo "::warning::the proof-status ledger is stale — run scripts/check-ledger.sh --update and commit docs/status-ledger.{jsonl,md}" ;;
            1) echo "::error::the proof-status ledger reports a REGRESSION (see the log above)"; exit 1 ;;
            *) echo "::error::the proof-status ledger could not be generated (exit $rc)"; exit 1 ;;
          esac
