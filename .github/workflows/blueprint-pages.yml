# Reusable Blueprint Pages build, adapted from verso-blueprint's
# project_template.  Differences from upstream:
#   * lakefile.toml, not lakefile.lean, in the cache keys
#   * 'lake exe cache get' before building, so mathlib comes from the
#     Azure cache rather than being compiled
#   * the harness steps are dropped (not used here)
#   * scripts/ci-pages.sh bypasses `vbp`, whose target is derived from the
#     package name (`lax-logic`) rather than the blueprint library
name: Blueprint Pages Reusable

on:
  workflow_call:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-blueprint-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Blueprint Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Restore only; the saves are at the end of the job and skipped on pull
      # requests (2026-10-11).  A pull request reads main's caches and adds
      # none of its own to the repository's 10 GB quota.
      - name: Restore Lake package cache
        id: pkgcache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/packages
          key: ${{ runner.os }}-lake-packages-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-packages-v1-
      - name: Restore Lean build cache
        id: buildcache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/build/lib
            .lake/build/ir
          key: ${{ runner.os }}-lean-build-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', '**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-lean-build-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
            ${{ runner.os }}-lean-build-v1-
      - name: Show tool versions
        run: |
          lean --version
          lake --version
      - name: Fetch mathlib cache
        run: lake exe cache get || true
      - name: Build Blueprint site
        run: ./scripts/ci-pages.sh
      # The papers go into the SAME artifact, under /clp-paper/ and /lax-paper/:
      # one Pages site per repository, and each deploy replaces all of it.
      - name: Install pandoc (renders the working guide)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
      - name: Build Verso papers (HTML) into the site
        run: ./scripts/ci-papers.sh _out/site/html-multi
      - name: Save Lake package cache (not on pull requests)
        if: github.event_name != 'pull_request' && steps.pkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .lake/packages
          key: ${{ steps.pkgcache.outputs.cache-primary-key }}
      - name: Save Lean build cache (not on pull requests)
        if: github.event_name != 'pull_request' && steps.buildcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .lake/build/lib
            .lake/build/ir
          key: ${{ steps.buildcache.outputs.cache-primary-key }}
      - name: Remove superseded caches
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/prune-caches.sh "${{ runner.os }}-lake-packages-v1-" "${{ steps.pkgcache.outputs.cache-primary-key }}"
          scripts/prune-caches.sh "${{ runner.os }}-lean-build-v1-" "${{ steps.buildcache.outputs.cache-primary-key }}"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _out/site/html-multi

  deploy:
    name: Deploy Pages
    # Deploys never overlap and are never cancelled half-way, whichever ref
    # or event started them; a second deploy waits for the first.
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
